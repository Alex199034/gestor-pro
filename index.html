    @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .sheet-enter{animation:slideUp .32s cubic-bezier(.32,.72,0,1) forwards}
    .overlay-enter{animation:fadeIn .2s ease forwards}
    .toast-enter{animation:toastIn .3s cubic-bezier(.32,.72,0,1) forwards}
    ::-webkit-scrollbar{display:none}*{scrollbar-width:none}
    input,select,button,textarea{font-family:'DM Sans',sans-serif;}
    input[type=date],input[type=time]{color:#292524;}
    input::placeholder{color:rgba(255,255,255,0.2);}
